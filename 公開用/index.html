<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pluot Knot | Embroidered Seersucker Pouches</title>
<meta name="description" content="pluotknot — 名前やモチーフを刺繍できる、シアサッカーのポーチ。公式サイト＆オンラインストア。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Dancing+Script:wght@500;600&family=Kalam:wght@400;700&family=Great+Vibes&family=Montserrat:wght@500;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Patrick+Hand&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="ロゴ/logo.png">
<style>

/* デザイン: Marine（確定） */
:root{
  --bg:#faf8f5; --bg2:#f2eee8; --ink:#1f1d1b; --ink2:#5d5852; --line:#e4ded5;
  --accent:#b9573f; --card:#f1ede7; --surface:#fff; --on-accent:#fff;
  --foot-bg:#1f1d1b; --foot-fg:#d9d2c8; --stripe-c:#d9cfc2; --stripe-o:.35;
  --serif:'Cormorant Garamond',serif; --sans:'Noto Sans JP',system-ui,sans-serif;
  --r:18px; --btn-r:999px; --h-case:none; --h-ls:.01em; --hero-bg2:#f1e3d5;
  --ease:cubic-bezier(.22,.8,.24,1);
}
/* Marine（確定デザイン） */
:root{ /* Marine */
  --bg:#f7f9fb; --bg2:#e6edf4; --ink:#13253d; --ink2:#53657c; --line:#d3dde8; --accent:#1f4f86; --card:#e8eef5; --surface:#fff;
  --foot-bg:#13253d; --foot-fg:#bccade; --stripe-c:#b5c7dc; --stripe-o:.8; --serif:'Playfair Display',serif; --r:6px; --btn-r:6px; --hero-bg2:#d5e2f0}
:root{--stripe:repeating-linear-gradient(90deg,var(--stripe-c) 0 3px,transparent 3px 9px)}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s,color .4s}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{width:min(1240px,100% - 40px);margin-inline:auto}
.eyebrow{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:500}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.1;letter-spacing:var(--h-ls);text-transform:var(--h-case)}
.sec{padding:110px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:44px;flex-wrap:wrap}
.sec-head h2,.studio h2,.about h2{font-size:clamp(2.2rem,5vw,3.6rem);margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 32px;border-radius:var(--btn-r);font-size:.88rem;letter-spacing:.08em;font-weight:500;transition:transform .3s var(--ease),background .3s,color .3s,box-shadow .3s}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-dark:hover{background:var(--accent);color:var(--on-accent);transform:translateY(-2px)}
.btn-line{border:1.5px solid var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--bg);transform:translateY(-2px)}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- Header ---------- */
header{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .4s,box-shadow .4s}
header.solid{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:12px}
.logo{font-family:var(--serif);font-size:1.75rem;font-weight:600;letter-spacing:.04em;text-transform:none}
.logo i{color:var(--accent);font-style:italic}
.menu{display:flex;gap:30px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.menu a{position:relative;padding:6px 0;cursor:pointer;white-space:nowrap}
.menu a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .4s var(--ease)}
.menu a:hover::after{transform:scaleX(1);transform-origin:left}
.nav-r{display:flex;align-items:center;gap:4px}
.icon-btn{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;transition:background .25s}
.icon-btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.icon-btn svg{width:23px;height:23px}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;font-size:.74rem;letter-spacing:.08em;margin-right:6px}
.lang button{padding:6px 12px}
.lang button.on{background:var(--ink);color:var(--bg)}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.68rem;display:grid;place-items:center;font-weight:700;transform:scale(0);transition:transform .35s var(--ease)}
.badge.on{transform:scale(1)}
.burger{display:none}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:100svh;padding:130px 0 70px;display:flex;align-items:center;overflow:hidden;background:radial-gradient(1000px 600px at 85% 20%,var(--hero-bg2) 0,transparent 60%),var(--bg)}
.hero::before{content:"";position:absolute;inset:0 0 0 55%;background:var(--stripe);opacity:var(--stripe-o);mask-image:linear-gradient(90deg,transparent,#000 40%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%)}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(3.4rem,9vw,7.6rem);margin:18px 0 26px;letter-spacing:-.01em;line-height:1}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p.lead{max-width:30em;color:var(--ink2);margin-bottom:38px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.hero-meta{display:flex;gap:34px;margin-top:54px;font-size:.78rem;color:var(--ink2);letter-spacing:.08em;flex-wrap:wrap}
.hero-meta b{display:block;font-family:var(--serif);font-size:1.7rem;font-weight:500;color:var(--ink);letter-spacing:0;text-transform:none}
.hero-art{position:relative;aspect-ratio:1/1.05}
.h-card{position:absolute;border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:0 30px 60px -28px rgba(0,0,0,.45);animation:float 9s ease-in-out infinite}
.h-card img{width:100%;height:100%;object-fit:cover}
.h-card.a{width:60%;aspect-ratio:3/4;left:0;top:6%}
.h-card.b{width:46%;aspect-ratio:3/4;right:0;top:0;animation-delay:-3s}
.h-card.c{width:48%;aspect-ratio:3/4;right:8%;bottom:0;animation-delay:-6s}
.h-card .tag{position:absolute;left:12px;bottom:12px;background:var(--surface);color:var(--ink);padding:4px 12px;border-radius:99px;font-size:.7rem;letter-spacing:.06em}
@keyframes float{50%{transform:translateY(-12px)}}
.scroll-cue{position:absolute;left:50%;bottom:22px;font-size:.66rem;letter-spacing:.3em;color:var(--ink2);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.scroll-cue::after{content:"";width:1px;height:34px;background:var(--ink2);animation:cue 2s infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.marquee{background:var(--ink);color:var(--bg);overflow:hidden;padding:16px 0;white-space:nowrap}
.marquee div{display:inline-flex;gap:46px;animation:mq 34s linear infinite;font-family:var(--serif);font-style:italic;font-size:1.3rem;padding-right:46px}
.marquee span::after{content:"✦";margin-left:46px;color:var(--accent);font-style:normal;font-size:.9rem}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- Shop ---------- */
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:9px 20px;border-radius:var(--btn-r);border:1px solid var(--line);font-size:.82rem;transition:all .25s;background:var(--surface)}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px 22px}
.card{cursor:pointer;display:block;text-align:left;width:100%;animation:fadeUp .6s var(--ease) both}
.card .pic{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--card)}
.card .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s,transform .8s var(--ease)}
.card .pic img.alt{opacity:0}
.card:hover .pic img.alt{opacity:1}
.card:hover .pic img{transform:scale(1.04)}
.pill{position:absolute;left:12px;top:12px;z-index:2;background:var(--surface);color:var(--ink);border-radius:99px;font-size:.68rem;padding:4px 12px;letter-spacing:.08em;font-weight:500}
.pill.emb{background:var(--accent);color:var(--on-accent);left:auto;right:12px}
.quick{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;background:var(--surface);color:var(--ink);border-radius:var(--btn-r);padding:11px;text-align:center;font-size:.78rem;letter-spacing:.1em;transform:translateY(130%);transition:transform .45s var(--ease)}
.card:hover .quick,.card:focus-visible .quick{transform:none}
.card h3{font-family:var(--sans);font-size:.95rem;font-weight:500;margin-top:14px;line-height:1.5;text-transform:none;letter-spacing:0}
.card .price{color:var(--ink2);font-size:.9rem;margin-top:2px}
.swatches{display:flex;gap:7px;margin-top:10px;align-items:center}
.sw{width:15px;height:15px;border-radius:50%;border:1px solid rgba(128,128,128,.4);box-shadow:inset 0 0 0 2px var(--surface)}
.sw-more{font-size:.72rem;color:var(--ink2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}}

/* ---------- Embroidery section ---------- */
.studio{background:var(--bg2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;counter-reset:s}
.step{background:var(--surface);border-radius:var(--r);padding:32px 26px;counter-increment:s;transition:transform .4s var(--ease)}
.step:hover{transform:translateY(-6px)}
.step::before{content:"0" counter(s);font-family:var(--serif);font-style:italic;font-size:2.8rem;color:var(--accent);line-height:1}
.step h3{font-family:var(--sans);font-size:1.02rem;font-weight:700;margin:14px 0 8px;text-transform:none;letter-spacing:0}
.step p{font-size:.88rem;color:var(--ink2)}
.showcase{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:center;margin-top:80px}
.show-stage{max-width:460px;width:100%;margin-inline:auto}
.studio .lead{color:var(--ink2);max-width:34em;margin:16px 0 28px}
.fontdemo{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.fontdemo span{padding:10px 18px;border-radius:12px;background:var(--surface);font-size:1.25rem;line-height:1.2}

/* ---------- About / Contact ---------- */
.about-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:70px;align-items:center}
.about-pic{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--card)}
.about-pic img{width:100%;height:100%;object-fit:cover}
.about p{color:var(--ink2);margin-bottom:16px;max-width:36em}
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
.values div{border-top:1px solid var(--ink);padding-top:14px;font-size:.84rem;color:var(--ink2)}
.values b{display:block;font-family:var(--serif);font-size:1.3rem;color:var(--ink);font-weight:500}
.contact{background:var(--bg2)}
.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:70px}
.contact p.lead{color:var(--ink2);margin:16px 0 26px;max-width:28em}
.c-list{list-style:none;font-size:.9rem;color:var(--ink2);display:grid;gap:10px}
.c-list b{color:var(--ink);font-weight:500;margin-right:8px}
.form-card{background:var(--surface);border-radius:var(--r);padding:34px}

/* ---------- Instagram / Footer ---------- */
.ig-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.ig-grid a{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card)}
.ig-grid img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.ig-grid a:hover img{transform:scale(1.08)}
footer{background:var(--foot-bg);color:var(--foot-fg);padding:80px 0 30px}
.foot{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:40px}
footer .logo{font-size:2rem;color:#fff}
footer p{font-size:.84rem;margin-top:12px;max-width:22em;opacity:.7}
footer h4{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:#fff;margin-bottom:16px;font-weight:500}
footer li{list-style:none;margin-bottom:9px;font-size:.88rem}
footer li a{cursor:pointer}
footer li a:hover{color:#fff}
.copy{border-top:1px solid rgba(255,255,255,.14);margin-top:56px;padding-top:24px;font-size:.76rem;opacity:.65;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* ---------- Overlays ---------- */
.veil{position:fixed;inset:0;background:rgba(10,8,6,.55);backdrop-filter:blur(3px);z-index:80;opacity:0;pointer-events:none;transition:opacity .35s}
.veil.on{opacity:1;pointer-events:auto}
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .35s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{position:relative;width:min(1120px,100%);max-height:calc(100svh - 48px);background:var(--bg);border-radius:calc(var(--r) + 8px);display:grid;grid-template-columns:1.05fr 1fr;overflow:hidden;transform:translateY(30px) scale(.98);transition:transform .5s var(--ease);box-shadow:0 40px 90px -30px rgba(0,0,0,.5)}
.sheet.narrow{grid-template-columns:1fr;width:min(620px,100%);overflow-y:auto}
.modal.on .sheet{transform:none}
.x{position:absolute;top:14px;right:14px;z-index:5;width:42px;height:42px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;font-size:1.2rem;transition:transform .3s var(--ease)}
.x:hover{transform:rotate(90deg)}
.stage-col{background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;min-height:0;gap:12px}
.stage{position:relative;width:min(100%,520px);aspect-ratio:3/4;container-type:inline-size;border-radius:calc(var(--r) - 2px);overflow:hidden;background:var(--card)}
.stage.edit{touch-action:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .stamp{position:absolute;left:14px;bottom:14px;background:var(--surface);color:var(--ink);padding:5px 13px;border-radius:99px;font-size:.7rem;letter-spacing:.06em}
.drag-hint{font-size:.76rem;color:var(--ink2);display:flex;gap:8px;align-items:center}

/* 刺繍レイヤー: 生地になじむよう multiply + 微小な歪み(SVGフィルタ) */
.emb-layer{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8cqw;color:var(--thread,#2b3a5c);transform-origin:center;white-space:nowrap}
.stage.edit .emb-layer{cursor:grab;pointer-events:auto;outline:1.5px dashed transparent;outline-offset:1.4cqw;border-radius:4px}
.stage.edit .emb-layer:hover,.stage.edit .emb-layer.drag,.stage.edit .emb-layer.sel{outline-color:rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.stage.edit .emb-layer.drag{cursor:grabbing}
.emb-inner{display:flex;flex-direction:column;align-items:center;gap:.8cqw;mix-blend-mode:multiply;filter:url(#stitch) drop-shadow(0 .18cqw 0 rgba(255,255,255,.28)) drop-shadow(0 -.12cqw 0 rgba(0,0,0,.28));opacity:.93}
.emb-inner.light{mix-blend-mode:normal}
.emb-layer svg{width:calc(var(--sz)*1cqw);height:calc(var(--sz)*1cqw*var(--ar,1));overflow:visible;display:block}
.emb-layer .t{line-height:1.05;font-size:calc(var(--sz)*1cqw);color:transparent;background:repeating-linear-gradient(60deg,var(--thread) 0 .3cqw,color-mix(in srgb,var(--thread) 78%,#000) .3cqw .55cqw);-webkit-background-clip:text;background-clip:text}
.f-block{font-family:'Graduate',serif;text-transform:uppercase;letter-spacing:.04em}
.f-script{font-family:'Dancing Script',cursive;font-weight:600}
.f-serif{font-family:'Playfair Display',serif;font-weight:600}
.f-sans{font-family:'Montserrat',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

.panel{padding:44px 40px 34px;overflow-y:auto;max-height:calc(100svh - 48px)}
.panel h2{font-size:2.3rem;line-height:1.15;margin:6px 0}
.panel .p-price{font-size:1.25rem;font-family:var(--serif);font-weight:500}
.panel .p-desc{color:var(--ink2);font-size:.9rem;margin:14px 0 6px}
.blk{margin-top:24px}
.blk>label,.blk>.lbl{display:flex;justify-content:space-between;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:12px}
.blk>.lbl b{color:var(--ink);font-weight:500;letter-spacing:.04em;text-transform:none}
.cols{display:flex;gap:12px;flex-wrap:wrap}
.col{width:54px}
.col .thumb{width:54px;height:54px;border-radius:12px;overflow:hidden;border:2px solid transparent;outline:1px solid var(--line);background:var(--card);transition:all .25s;display:block}
.col .thumb img{width:100%;height:100%;object-fit:cover}
.col.on .thumb{border-color:var(--ink);outline-color:transparent}
.threads{display:flex;gap:10px;flex-wrap:wrap}
.thr{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px rgba(128,128,128,.5);transition:transform .25s var(--ease),box-shadow .25s}
.thr:hover{transform:scale(1.12)}
.thr.on{box-shadow:0 0 0 2px var(--ink)}
.fonts,.motifs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fbtn{padding:10px 4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:1.15rem;line-height:1.2;transition:all .25s}
.fbtn small{display:block;font-family:var(--sans);font-size:.62rem;color:var(--ink2);margin-top:2px;letter-spacing:.04em;text-transform:none}
.fbtn.on,.mbtn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mbtn{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;place-items:center;transition:all .25s;font-size:.7rem;color:var(--ink2)}
.mbtn svg{width:46%;height:46%;color:var(--ink)}
.mbtn:hover{transform:translateY(-2px)}
.txt{width:100%;padding:15px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:1rem;transition:border-color .25s}
textarea.txt{resize:vertical;min-height:130px}
.txt:focus{outline:none;border-color:var(--ink)}
.hint{font-size:.74rem;color:var(--ink2);margin-top:8px}
.notice{background:var(--bg2);border-radius:12px;padding:14px 16px;font-size:.82rem;color:var(--ink2)}
.range{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;font-size:.8rem;color:var(--ink2);margin-bottom:6px}
.range input{width:100%;accent-color:var(--accent)}
.mini{font-size:.76rem;text-decoration:underline;color:var(--ink2);margin-top:6px}
.buy{display:flex;gap:12px;margin-top:30px;align-items:stretch}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.qty button{width:42px;height:100%;font-size:1.15rem}
.qty span{min-width:22px;text-align:center;font-size:.92rem}
.buy .btn{flex:1}
.fee{font-size:.78rem;color:var(--accent);margin-top:12px}

/* Drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:90;display:flex;flex-direction:column;transform:translateX(102%);visibility:hidden;transition:transform .55s var(--ease),visibility 0s .55s;box-shadow:-30px 0 60px -30px rgba(0,0,0,.35)}
.drawer.on{transform:none;visibility:visible;transition:transform .55s var(--ease),visibility 0s}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-bottom:1px solid var(--line)}
.d-head h3{font-size:1.7rem}
.d-body{flex:1;overflow-y:auto;padding:8px 26px}
.empty{text-align:center;padding:80px 10px;color:var(--ink2)}
.empty svg{width:54px;height:54px;margin:0 auto 18px;opacity:.4}
.line{display:grid;grid-template-columns:84px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.line .th{position:relative;width:84px;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--card);container-type:inline-size}
.line .th img{width:100%;height:100%;object-fit:cover}
.line h4{font-size:.9rem;font-weight:500;line-height:1.4}
.line .meta{font-size:.76rem;color:var(--ink2);line-height:1.6;margin:3px 0 8px}
.line .row{display:flex;justify-content:space-between;align-items:center}
.line .qty{transform:scale(.86);transform-origin:left}
.line .rm{font-size:.74rem;color:var(--ink2);text-decoration:underline}
.d-foot{padding:20px 26px 26px;border-top:1px solid var(--line);background:var(--surface)}
.sum{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:6px;color:var(--ink2)}
.sum.total{color:var(--ink);font-size:1.1rem;font-weight:700;margin:12px 0 18px}
.ship-bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.ship-bar i{display:block;height:100%;background:var(--accent);transition:width .5s var(--ease)}
.ship-note{font-size:.76rem;color:var(--ink2);margin-bottom:12px}

/* Checkout */
.co{position:fixed;inset:0;z-index:95;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .6s var(--ease)}
.co.on{transform:none}
.demo-note{margin:0;padding:10px 16px;background:#fff4d6;color:#6b4a00;border-bottom:1px solid #f0d58a;text-align:center;font-size:.82rem;font-weight:500}
.co-top{display:flex;justify-content:space-between;align-items:center;height:72px;border-bottom:1px solid var(--line);padding:0 clamp(16px,4vw,48px);background:var(--bg);position:sticky;top:0;z-index:3}
.co-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;padding:44px 0 90px}
.co h3{font-size:1.9rem;margin:0 0 18px}
.co fieldset{border:0;margin-bottom:38px}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld .full{grid-column:1/-1}
.fld label,.form-card label.s{font-size:.74rem;color:var(--ink2);display:block;margin-bottom:6px;letter-spacing:.06em}
.txt.bad{border-color:#c0392b;background:color-mix(in srgb,#c0392b 8%,var(--surface))}
.pay-tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.pay-opt{display:flex;align-items:center;gap:14px;padding:18px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;transition:all .25s}
.pay-opt.on{border-color:var(--ink)}
.pay-opt .logo-ic{width:46px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:.7rem;font-weight:700;color:#fff;flex:none}
.pay-opt b{font-size:.92rem;display:block;font-weight:500}
.pay-opt small{font-size:.72rem;color:var(--ink2)}
.pay-pane{display:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.pay-pane.on{display:block;animation:fadeUp .4s var(--ease)}
.cardviz{height:150px;border-radius:14px;background:linear-gradient(135deg,#2b2724,#5a4a3c);color:#fff;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:18px;position:relative;overflow:hidden}
.cardviz::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#fff 0 3px,transparent 3px 9px);opacity:.06}
.cardviz .num{font-family:'Montserrat',monospace;letter-spacing:.14em;font-size:1.05rem}
.cardviz .low{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.qrbox{display:flex;gap:20px;align-items:center}
.qr{width:110px;height:110px;border-radius:10px;background:#ff0033;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-size:1.05rem}
.demo-note{margin-top:14px;font-size:.74rem;color:#7a5a00;background:#fff3cf;padding:10px 14px;border-radius:10px}
.co-side{position:sticky;top:96px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.co-side .line{padding:14px 0}
.done{text-align:center;padding:100px 20px;max-width:560px;margin:0 auto}
.done .ok{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto 26px;font-size:2.3rem;animation:pop .6s var(--ease)}
@keyframes pop{from{transform:scale(0)}}
.done h2{font-size:2.8rem;margin-bottom:14px}
.done p{color:var(--ink2);margin-bottom:8px}

/* 注文状況 */
.otitle{font-size:2.1rem;margin-bottom:6px}
.sheet.narrow .inner{padding:44px 40px 36px}
.tl{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);margin:26px 0 12px;position:relative}
.tl li{text-align:center;font-size:.76rem;color:var(--ink2);position:relative;padding-top:34px}
.tl li::before{content:"";position:absolute;top:8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--line);z-index:1}
.tl li::after{content:"";position:absolute;top:16px;left:-50%;width:100%;height:2px;background:var(--line)}
.tl li:first-child::after{display:none}
.tl li.reached::before,.tl li.reached::after{background:var(--accent)}
.tl li.now{color:var(--ink);font-weight:700}
.o-card{background:var(--bg2);border-radius:14px;padding:16px 18px;margin-top:16px;font-size:.86rem}
.o-card .line{padding:12px 0;grid-template-columns:64px 1fr}
.o-card .line .th{width:64px}

.toast{position:fixed;left:50%;bottom:28px;z-index:120;background:var(--ink);color:var(--bg);padding:14px 24px;border-radius:99px;font-size:.86rem;transform:translate(-50%,160%);transition:transform .5s var(--ease);display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0)}
.toast button{text-decoration:underline;font-size:.82rem}
.rv{opacity:0;transform:translateY(30px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}


/* =========================================================
   Marine レイアウト（確定デザイン）
========================================================= */
.logo-img{height:46px;width:auto;display:block}
header .logo{display:flex;align-items:center}
header{background:var(--bg);box-shadow:0 1px 0 var(--line)}
header::before{content:"";display:block;height:9px;background:repeating-linear-gradient(90deg,var(--accent) 0 16px,var(--surface) 16px 32px)}
footer .logo-img{height:64px;filter:brightness(0) invert(1);opacity:.92}
.co-top .logo-img{height:40px}
.card .pic,.stage,.about-pic,.pk,.col .thumb,.ig-grid a{background:#f1f1f1}

/* ヒーロー: 見出し + 流れる写真 */
.hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;min-height:min(92svh,760px);padding:110px 0 0;text-align:left;overflow:hidden;background:var(--bg)}
.hero::before{display:none}
.hero-text{display:flex;flex-direction:column;align-items:flex-start;position:relative;z-index:2;margin:0;width:auto;max-width:640px;justify-self:end;padding:0 0 0 max(24px,calc((100vw - 1200px)/2 + 24px))}
.hero h1{margin-right:-14vw;text-shadow:0 2px 24px color-mix(in srgb,var(--bg) 80%,transparent)}
.hero{position:relative}
.hero .strip{margin:0;align-self:stretch;height:100%;min-height:520px;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%);mask-image:linear-gradient(90deg,transparent,#000 12%)}
.hero .track img{height:min(78svh,640px)}
.hero h1{font-size:clamp(3rem,8vw,6.4rem)}
.hero p.lead{margin-inline:0}
.hero-cta,.hero-meta{justify-content:flex-start}
.strip{margin-top:56px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.track .set>img{scroll-snap-align:start}
.hero-arrows{position:absolute;right:24px;bottom:24px;z-index:3;display:flex;gap:8px}
.hero-arrows .arrow{background:var(--surface);color:var(--ink);width:52px;height:52px;font-size:1.7rem;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.hero-arrows #heroNext{animation:nudge 1.6s ease-in-out infinite}
.hero-arrows #heroNext.seen{animation:none}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.hero-dots{position:absolute;left:45%;right:0;bottom:36px;z-index:3;display:flex;gap:8px;justify-content:center;pointer-events:none}
.hero-dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(19,37,61,.35);transition:all .3s}
.hero-dots i.on{width:30px;border-radius:5px;background:#fff}
.hero-hand{position:absolute;right:30%;top:50%;z-index:3;width:56px;height:56px;margin-top:-28px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:swipeHint 2.2s ease-in-out 3 forwards;opacity:0}
.hero-hand svg{width:30px;height:30px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes swipeHint{0%{opacity:0;transform:translateX(30px)}20%{opacity:1}70%{opacity:1;transform:translateX(-50px)}100%{opacity:0;transform:translateX(-50px)}}
.track{display:flex;flex:none;width:max-content}
.track .set{display:flex;gap:16px;padding-right:16px}
.track img{height:clamp(240px,40vw,460px);width:auto;border-radius:var(--r);flex:none;object-fit:cover;background:var(--card)}
@keyframes flow{to{transform:translateX(-50%)}}

/* セクションの境目: 縞のリボン + 交互の背景 + 番号 */
main{counter-reset:sec}
.sec{counter-increment:sec;position:relative;padding:136px 0 120px}
.sec::before{content:"";position:absolute;top:0;left:0;right:0;height:34px;background:repeating-linear-gradient(90deg,var(--accent) 0 16px,color-mix(in srgb,var(--accent) 20%,var(--surface)) 16px 32px)}
.sec{padding-top:170px!important;background-image:repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 9%,transparent) 0 14px,transparent 14px 34px);background-size:100% 100%}
.sec:nth-of-type(even){background-image:repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,transparent) 0 14px,transparent 14px 34px)}
.marquee{border-block:10px solid var(--accent)}
#shop,#about,#contact{background:var(--bg)}
#embroidery,#instagram,#orders{background:var(--bg2)}
.eyebrow.no::before{content:counter(sec,decimal-leading-zero) "  /  "}

/* 商品一覧: 横スクロール */
.head-r{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.arrows{display:flex;gap:8px}
.arrow{width:42px;height:42px;border:1.5px solid var(--ink);border-radius:var(--btn-r);font-size:1.4rem;line-height:1;transition:background .25s,color .25s}
.arrow:hover{background:var(--ink);color:var(--bg)}
.grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:20px;padding:4px 4px 20px;margin-inline:-4px}
.card{flex:0 0 min(290px,74vw);scroll-snap-align:start;background:var(--surface);border:1.5px solid var(--ink);padding:12px;border-radius:var(--r);width:auto}
.card h3{border-top:2px dashed var(--line);padding-top:12px}
.card.soon{cursor:default}
.card.soon .pic{display:grid;place-items:center;background:repeating-linear-gradient(90deg,var(--bg2) 0 14px,var(--surface) 14px 28px)}
.card.soon .pic img.lg{position:static;inset:auto;width:60%;height:auto;object-fit:contain;opacity:.6}
.card.soon:hover .pic img{transform:none}
.soon-pill{left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);letter-spacing:.14em;padding:5px 16px}
.step{border:1.5px dashed var(--ink);background:transparent}
.form-card,.about-pic{border:1.5px solid var(--ink)}
footer{border-top:30px solid var(--accent);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 14px,transparent 14px 34px)}


/* ===== デザイン案（採用後に不要な案とパネルを削除） ===== */
.divider{position:relative;height:56px;background:var(--bg);display:grid;place-items:center}
.divider img{display:none;height:60px;filter:none}
html[data-div="a"] .divider{height:30px;background:repeating-linear-gradient(90deg,var(--accent) 0 16px,color-mix(in srgb,var(--accent) 20%,var(--surface)) 16px 32px)}
html[data-div="b"] .divider{height:44px;background:var(--bg)}
html[data-div="b"] .divider::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--accent) 25%,transparent 25%) 0 0/44px 44px,linear-gradient(225deg,var(--accent) 25%,transparent 25%) 0 0/44px 44px;opacity:.9;clip-path:inset(0 0 0 0)}
html[data-div="b"] .divider::before{background:conic-gradient(from 135deg at 50% 0,var(--accent) 90deg,transparent 0) 0 0/44px 100%}
html[data-div="c"] .divider{height:34px;background:var(--bg2)}
html[data-div="c"] .divider::before{content:"";position:absolute;left:0;right:0;top:0;height:20px;background:radial-gradient(circle at 50% 0,var(--accent) 0 16px,transparent 16.5px) 0 0/36px 20px repeat-x}
html[data-div="d"] .divider{height:110px;background:repeating-linear-gradient(90deg,var(--accent) 0 16px,color-mix(in srgb,var(--accent) 20%,var(--surface)) 16px 32px)}
html[data-div="d"] .divider img{display:block;background:var(--bg);padding:10px 36px;border:2px solid var(--accent)}
html[data-div="e"] .divider{height:40px;background:var(--bg)}

/* 背景案 */
html[data-sec="a"] .sec>.wrap{background:var(--surface);border:1.5px solid var(--ink);outline:6px solid color-mix(in srgb,var(--accent) 14%,transparent);padding:48px clamp(18px,4vw,56px);box-shadow:10px 10px 0 color-mix(in srgb,var(--accent) 22%,transparent)}
html[data-sec="a"] #shop,html[data-sec="a"] #about,html[data-sec="a"] #contact,html[data-sec="a"] #embroidery,html[data-sec="a"] #instagram,html[data-sec="a"] #orders{background-color:var(--bg2);background-image:repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent) 0 22px,transparent 22px 56px)}
html[data-sec="b"] .sec{background-color:var(--bg)!important;background-image:linear-gradient(color-mix(in srgb,var(--accent) 12%,transparent) 50%,transparent 50%),linear-gradient(90deg,color-mix(in srgb,var(--accent) 12%,transparent) 50%,transparent 50%)!important;background-size:48px 48px!important}
html[data-sec="b"] .sec-head h2,html[data-sec="b"] .studio h2,html[data-sec="b"] .about h2,html[data-sec="b"] .contact h2{display:inline-block;background:var(--surface);padding:6px 22px;border:2px dashed var(--accent);outline:6px solid var(--surface)}
html[data-sec="c"] .sec{background-color:var(--bg)!important;background-image:radial-gradient(color-mix(in srgb,var(--accent) 22%,transparent) 3px,transparent 3.5px)!important;background-size:26px 26px!important}
html[data-sec="c"] .sec:nth-of-type(even){background-color:var(--bg2)!important}
html[data-sec="c"] .sec>.wrap{border:2px dashed color-mix(in srgb,var(--accent) 60%,transparent);border-radius:14px;padding:44px clamp(18px,4vw,52px);background:color-mix(in srgb,var(--surface) 88%,transparent);outline:10px solid var(--surface)}
html[data-sec="d"] .sec{background-image:none!important;overflow:hidden}
html[data-sec="d"] .sec:nth-of-type(odd){background:var(--surface)!important}
html[data-sec="d"] .sec:nth-of-type(even){background:var(--bg2)!important}
html[data-sec="d"] .sec::after{content:counter(sec,decimal-leading-zero);position:absolute;right:3vw;top:60px;font-family:var(--serif);font-style:italic;font-size:clamp(7rem,22vw,20rem);line-height:1;color:color-mix(in srgb,var(--accent) 9%,transparent);pointer-events:none}
html[data-sec="d"] .wrap{position:relative;z-index:1}
html[data-sec="d"] #about{background:var(--foot-bg)!important;color:var(--foot-fg)}
html[data-sec="d"] #about h2,html[data-sec="d"] #about p,html[data-sec="d"] #about .eyebrow{color:#fff}
html[data-sec="e"] .sec{background-image:none!important;background-color:var(--bg)!important}
html[data-sec="e"] main{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 20%,var(--bg)) 0 20px,var(--bg) 20px 44px)}
html[data-sec="e"] .sec>.wrap{background:var(--bg);padding:56px clamp(18px,4vw,56px);box-shadow:0 0 0 1px var(--line),0 24px 60px -30px rgba(19,37,61,.35)}
html[data-sec="e"] .sec{background:transparent!important;padding-block:100px!important}

/* 案の切替パネル */
.proto{position:fixed;right:12px;bottom:12px;z-index:90;background:var(--surface);border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:.72rem;box-shadow:0 8px 30px rgba(0,0,0,.18);max-width:calc(100vw - 24px)}
.proto b{display:block;margin:2px 0 4px;letter-spacing:.06em}
.proto div{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.proto button{min-width:30px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:700}
.proto button.on{background:var(--ink);color:#fff}

/* 刺繍プレビュー（固定位置） */
.stage.edit{touch-action:auto}
.stage.edit .emb-layer{cursor:default;pointer-events:none;outline:0;box-shadow:none}
.emb-layer svg{width:calc(var(--msz)*1cqw);height:calc(var(--msz)*1cqw*var(--ar,1))}
.emb-layer .t{font-size:calc(var(--tsz)*1cqw)}
.emb-layer.ph .emb-inner{opacity:.42;mix-blend-mode:normal}
.emb-layer.ph{outline:1.5px dashed rgba(60,70,90,.55)!important;outline-offset:1.2cqw;border-radius:3px}
.f-f1{font-family:'Bree Serif',serif}
.f-f2{font-family:'Great Vibes',cursive}
.f-f30{font-family:'Dancing Script',cursive;font-weight:600}
.f-f32{font-family:'Bree Serif',serif;-webkit-text-stroke:.045em currentColor;paint-order:stroke fill}
.f-f95{font-family:'Kalam',cursive}
.fonts{grid-template-columns:repeat(3,1fr)}
.fbtn{font-size:1.25rem;padding:12px 4px}
.fbtn.f-f2{font-size:1.5rem}
.threads{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 6px}
.thr-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border-radius:10px;font-size:.64rem;line-height:1.25;color:var(--ink2)}
.thr-item small{text-align:center}
.thr-item .thr{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px rgba(128,128,128,.5)}
.thr-item.on .thr{box-shadow:0 0 0 2px var(--ink)}
.thr-item.on{color:var(--ink);font-weight:700}

/* 確認ダイアログ */
.dlg{position:fixed;inset:0;z-index:140;display:grid;place-items:center;padding:20px;background:rgba(10,8,6,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.dlg.on{opacity:1;pointer-events:auto}
.dlg-box{background:var(--surface);border-radius:var(--r);padding:36px 30px 28px;max-width:460px;width:100%;text-align:center;box-shadow:0 30px 70px -30px rgba(0,0,0,.6)}
.dlg-box p{font-size:1.05rem;line-height:1.8;margin-bottom:26px}
.dlg-btns{display:flex;gap:12px}
.dlg-btns .btn{flex:1}

/* ---------- 刺繍エディター / 表示モード ---------- */
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:var(--btn-r);overflow:hidden;background:var(--surface)}
.tab{padding:9px 22px;font-size:.84rem}
.tab.on{background:var(--ink);color:var(--bg)}
.tab[disabled]{opacity:.35;cursor:not-allowed}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
.pk{width:52px;height:52px;border-radius:12px;overflow:hidden;border:2px solid transparent;outline:1px solid var(--line);background:var(--card)}
.pk img{width:100%;height:100%;object-fit:cover}
.pk.on{border-color:var(--ink);outline-color:transparent}
.st-name{font-size:1.9rem;line-height:1.15;margin:4px 0}
.add-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.btn.sm{padding:10px 18px;font-size:.8rem}
.lyrs{display:flex;gap:8px;flex-wrap:wrap}
.lyr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;height:64px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:1.05rem;line-height:1.1;max-width:120px;overflow:hidden}
.lyr b{font-weight:500;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyr svg{width:26px;height:26px;color:var(--ink)}
.lyr small{font-family:var(--sans);font-size:.6rem;color:var(--ink2);letter-spacing:.04em}
.lyr.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sel-box .mbtn{aspect-ratio:auto;height:54px}
.sel-box{margin-top:6px;padding:4px 16px 14px;border-radius:14px;background:color-mix(in srgb,var(--ink) 4%,transparent)}
.row-btns{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.studio-head{max-width:640px;margin:80px 0 4px}
.studio-head .lead{margin-bottom:6px}
.studio-sheet{width:100%;max-height:none;transform:none!important;box-shadow:none;border:1px solid var(--line);margin-top:26px;overflow:visible}
.studio-sheet .panel{max-height:none;overflow:visible}
.line .ths{display:grid;gap:6px;align-content:start}
@media (max-width:900px){
  .studio-sheet{overflow:visible;max-height:none;border-radius:var(--r)}
  .studio-sheet .stage-col{position:static}
}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const store = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };

let lang = store.get('pk_lang', (navigator.language || 'ja').startsWith('ja') ? 'ja' : 'en');
const T = () => I18N[lang];
const t = (k, vars) => { let s = T()[k] ?? I18N.ja[k] ?? k; if(vars) for(const v in vars) s = s.replace('{' + v + '}', vars[v]); return s; };
const L = o => o[lang] || o.ja;
const threadOf = hex => THREADS.find(x => x.hex === hex) || THREADS[5];
const threadLabel = hex => { const x = threadOf(hex); return L(x); };

/* ---------- 言語 ---------- */

/* =========================================================

========================================================= */
const isLight = hex => { const n = parseInt(hex.slice(1), 16); return (0.299*(n>>16) + 0.587*(n>>8&255) + 0.114*(n&255)) / 255 > .72; };
const fl = f => f ? `style="filter:${f}"` : '';
const blank = () => ({ text:'', font:'f1', thread:THREADS[5].hex, motif:'none' });
const dActive = d => !!d && (String(d.text).trim() !== '' || d.motif !== 'none');
function embHTML(side, d, placeholder){
  const text = String(d.text || '').trim(), has = d.motif && d.motif !== 'none', z = side.size;
  const ghost = !text && !has;
  if(ghost && !placeholder) return '';
  const label = ghost ? 'Name' : text;
  const tsz = label ? Math.min(z.t, z.maxw / (label.length * (FONT_K[d.font] || .6))) : z.t;
  return `<div class="emb-layer ${ghost ? 'ph' : ''}" style="left:${side.pos.x}%;top:${side.pos.y}%;--tsz:${tsz.toFixed(2)};--msz:${z.m};--thread:${d.thread};transform:translate(-50%,-50%) rotate(${side.rot || 0}deg)"><div class="emb-inner ${isLight(d.thread) ? 'light' : ''}">
    ${has ? `<svg aria-hidden="true" style="--ar:${d.motif === 'dino' ? .8 : 1}"><use href="#m-${d.motif}"/></svg>` : ''}${label ? `<span class="t f-${d.font}">${esc(label)}</span>` : ''}</div></div>`;
}
function stageInner(p, ci, key, design, editing){
  const c = p.colors[ci], side = c.sides[key];
  return `<img src="${IMG(side.img)}" alt="${esc(L(p.name))} ${esc(L(c.name))}" ${fl(c.filter)}>${side.edit ? embHTML(side, (design && design[key]) || blank(), editing) : `<span class="stamp">${t('sample_stamp')}</span>`}`;
}
const designSides = (c, design) => Object.keys(c.sides).filter(k => c.sides[k].edit && dActive(design && design[k]));
const designFee = (c, design) => designSides(c, design).filter(k => design[k].motif !== 'none').length * CONFIG.MOTIF_FEE;
const cleanDesign = (c, design) => { const ks = designSides(c, design); if(!ks.length) return null; const o = {}; ks.forEach(k => { o[k] = { ...design[k], text:String(design[k].text).trim() }; }); return o; };
const layerSummary = d => [d.text.trim() && `「${esc(d.text.trim())}」`, d.text.trim() && fontLabel(d.font), threadLabel(d.thread), d.motif !== 'none' && T().motifs[d.motif]].filter(Boolean).join(' / ');

function cardHTML(p, i){
  if(p.soon) return `<div class="card soon" style="animation-delay:${i*60}ms" aria-disabled="true">
      <div class="pic"><span class="pill soon-pill">Coming soon</span><img class="lg" data-logo src="${encodeURI(CONFIG.LOGO)}" alt=""></div>
      <h3>${esc(L(p.name))}</h3><div class="price">${yen(p.price)}</div><div class="swatches"><span class="sw-more">Coming soon</span></div></div>`;
  const c0 = p.colors[0], first = c0.sides.front, other = (p.colors[1] && p.colors[1].sides.front) || c0.sides.back;
  const two = !!c0.sides.back;
  return `<button class="card" data-id="${p.id}" style="animation-delay:${i*60}ms">
      <div class="pic">
        ${p.badge ? `<span class="pill">${t('badge_' + p.badge)}</span>` : ''}
        <span class="pill emb">${t('emb_ok')}</span>
        <img src="${IMG(first.img)}" ${fl(c0.filter)} alt="${esc(L(p.name))}" loading="lazy">
        ${other ? `<img class="alt" src="${IMG(other.img)}" ${fl((p.colors[1] || c0).filter)} alt="" loading="lazy">` : ''}
        <span class="quick">${t('quick')}</span>
      </div>
      <h3>${esc(L(p.name))}</h3><div class="price">${yen(p.price)}</div>
      <div class="swatches">${p.colors.map(c => `<i class="sw" style="background:${c.hex}" title="${esc(L(c.name))}"></i>`).join('')}<span class="sw-more">${two ? t('two_sided') : p.colors.length + ' ' + t('colors')}</span></div>
    </button>`;

  const lines = [`${t('order_no')}: ${o.id}`, `${t('co_name')}: ${o.customer.name}`, `${t('co_mail')}: ${o.customer.email}`, `${t('co_tel')}: ${o.customer.tel}`,
    `${t('co_zip')}: ${o.customer.zip}`, `${t('co_addr')}: ${o.customer.pref} ${o.customer.addr}`, '', '--- Items ---'];
  o.items.forEach(i => {
    const p = PRODUCTS.find(x => x.id === i.pid), c = p.colors[i.ci];
    lines.push(`${L(p.name)} / ${L(c.name)} x${i.qty}  ${yen(i.unit * i.qty)}`);
    Object.entries(i.design || {}).forEach(([k, d]) => lines.push(`  ${t('side_' + k)}: "${d.text}" font=${fontLabel(d.font)} thread=${threadLabel(d.thread)} motif=${d.motif}`));

  return lines.join('\n');
}

  let bad = null;
  need.forEach(id => {
    const el = $('#' + id); let ok = el.value.trim() !== '';
    if(id === 'f-mail') ok = /^\S+@\S+\.\S+$/.test(el.value);
    if(id === 'c-num') ok = el.value.replace(/\s/g,'').length >= 15;
    if(id === 'c-exp') ok = /^(0[1-9]|1[0-2])\/\d\d$/.test(el.value);

      items:[{ pid:'p1', ci:0, qty:1, unit:7700, design:{ front:{ text:'AO', font:'f32', thread:THREADS[5].hex, motif:'star' } } }] };
  }
  const o = store.get('pk_orders2', []).find(x => x.id.toUpperCase() === id.trim().toUpperCase() && x.email === email.trim().toLowerCase());
  if(!o) return null;
  const min = (Date.now() - o.placedAt) / 60000;     // デモ: 経過時間でステータスを進める
  o.status = min < 2 ? 'received' : min < 10 ? 'making' : min < 60 ? 'shipped' : 'delivered';
  if(o.status === 'shipped' || o.status === 'delivered') o.track = '4412-' + o.id.replace(/\D/g,'').padEnd(4,'0').slice(0,4) + '-0098';
  return o;
}
const STEPS = ['received','making','shipped','delivered'];
function renderOrders(){
  const r = state.orderResult;
  let html = `<p style="color:var(--ink2);font-size:.9rem;margin-bottom:22px">${t('or_lead')}</p>

      <div class="full"><label class="s" for="o-mail">${t('or_mail')}</label><input class="txt" id="o-mail" type="email" autocomplete="email" value="${esc(state.orderMail || '')}"></div>
    </div><button class="btn btn-dark btn-block" style="margin-top:16px" type="submit">${t('or_find')}</button></form>
    <p class="hint">${t('or_demo')}</p>`;
  if(r === 'nf') html += `<div class="notice" style="margin-top:18px;color:#c0392b">${t('or_nf')}</div>`;
  else if(r){

    html += `<div class="o-card"><b>${t('order_no')}: ${esc(r.id)}</b>
      <ol class="tl">${STEPS.map((k,i) => `<li class="${i <= idx ? 'reached' : ''} ${i === idx ? 'now' : ''}">${t('st_' + k)}</li>`).join('')}</ol>
      <p style="text-align:center;font-size:.86rem;margin-bottom:6px">${T().st_msg[r.status]}</p>
      <p style="font-size:.78rem;color:var(--ink2);text-align:center">${t('or_placed')}: ${new Date(r.placedAt).toLocaleDateString(lang === 'ja' ? 'ja-JP' : 'en-US')}${r.track ? ` ／ ${t('or_track')}: ${esc(r.track)}` : ''}</p>
      ${r.items.map(i => lineHTML(i, 0, false)).join('')}
      <div class="sum total" style="margin:8px 0 0"><span>${t('total')}</span><span>${yen(r.total)}</span></div></div>`;
  }

}
document.addEventListener('submit', async e => {

let ctSent = false;
function renderContact(){
  const c = $('#contactCard');
  if(ctSent){
    c.innerHTML = `<div style="text-align:center;padding:30px 0"><div class="done" style="padding:0"><div class="ok" style="width:64px;height:64px;font-size:1.7rem">✓</div></div><h3 style="font-size:1.9rem;margin-bottom:10px">${t('ct_thanks_h')}</h3><p style="color:var(--ink2);margin-bottom:22px">${t('ct_thanks_p')}</p><button class="btn btn-line" id="ctAgain">${t('ct_again')}</button></div>`;
    return;
  }
  const keep = id => esc(($('#' + id) && $('#' + id).value) || '');
  c.innerHTML = `<form id="ctForm" novalidate><div class="fld">
    <div><label class="s" for="ct-name">${t('ct_name')}</label><input class="txt" id="ct-name" autocomplete="name" value="${keep('ct-name')}"></div>
    <div><label class="s" for="ct-email">${t('ct_email')}</label><input class="txt" id="ct-email" type="email" autocomplete="email" value="${keep('ct-email')}"></div>
    <div><label class="s" for="ct-topic">${t('ct_topic')}</label><select class="txt" id="ct-topic">${[1,2,3,4,5].map(n => `<option value="${n}">${t('ct_t' + n)}</option>`).join('')}</select></div>
    <div><label class="s" for="ct-order">${t('ct_order')}</label><input class="txt" id="ct-order" placeholder="PK-XXXXXXXX" value="${keep('ct-order')}"></div>
    <div class="full"><label class="s" for="ct-msg">${t('ct_msg')}</label><textarea class="txt" id="ct-msg">${keep('ct-msg')}</textarea></div>
  </div><button class="btn btn-dark btn-block" style="margin-top:16px" type="submit" id="ctBtn">${t('ct_send')}</button><p class="hint">${t('ct_demo')}</p></form>`;
}
document.addEventListener('submit', async e => {
  if(e.target.id !== 'ctForm') return; e.preventDefault();
  let bad = null;
  ['ct-name','ct-email','ct-msg'].forEach(id => {
    const el = $('#' + id); let ok = el.value.trim() !== ''; if(id === 'ct-email') ok = /^\S+@\S+\.\S+$/.test(el.value);
    el.classList.toggle('bad', !ok); if(!ok && !bad) bad = el;
  });
  if(bad){ bad.focus(); return; }
  const v = id => $('#' + id).value.trim(), topic = t('ct_t' + $('#ct-topic').value);
  const rec = { name:v('ct-name'), email:v('ct-email'), topic, order:v('ct-order'), message:v('ct-msg'), at:Date.now() };
  const all = store.get('pk_inquiries', []); all.push(rec); store.set('pk_inquiries', all);
  ctSent = true; renderContact();
  sendToShop('inquiry', `[Inquiry] ${topic} - ${rec.name}`, `${t('ct_name')}: ${rec.name}\n${t('ct_email')}: ${rec.email}\n${t('ct_topic')}: ${topic}\n${t('ct_order')}: ${rec.order}\n\n${rec.message}`);
});
document.addEventListener('click', e => { if(e.target.closest('#ctAgain')){ ctSent = false; ['ct-name','ct-email','ct-order','ct-msg'].forEach(id => { const el = $('#' + id); if(el) el.value = ''; }); renderContact(); } });
document.addEventListener('input', e => { if(e.target.classList?.contains('bad')) e.target.classList.remove('bad'); });

/* ヘッダーの現在地ハイライト（ヘッダー順 = ページ順） */
(() => {
  const links = $$('#menu a[href^="#"]'), map = new Map(links.map(a => [a.getAttribute('href').slice(1), a]));
  if(!('IntersectionObserver' in window)) return;
  const so = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ links.forEach(l => l.classList.remove('cur')); map.get(e.target.id)?.classList.add('cur'); } }), { rootMargin:'-45% 0px -50% 0px' });
  map.forEach((_, id) => { const el = document.getElementById(id); if(el) so.observe(el); });
})();

applyLang();

<style>
.dv-bar{position:fixed;top:86px;left:50%;transform:translateX(-50%);z-index:95;display:flex;gap:2px;padding:4px;background:rgba(19,37,61,.92);border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);font:600 .72rem/1 'Noto Sans JP',sans-serif}
.dv-bar button,.dv-bar button.on{all:unset;box-sizing:border-box;color:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;font:600 .74rem/1 'Noto Sans JP',sans-serif;box-shadow:none}
.dv-bar .txt{all:unset}

.dv-bar button.on{background:#fff!important;color:#13253d!important}

.dv-ov{position:fixed;inset:0;z-index:200;background:#2a2f38;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:70px 16px 16px}
.dv-ov.on{display:flex}

.dv-label{color:#cfd6e0;font:500 .8rem 'Noto Sans JP',sans-serif;letter-spacing:.04em}
.dv-dev{background:#111;border-radius:34px;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);transform-origin:top left;flex:none;width:max-content}
.dv-dev.pc{border-radius:14px;padding:10px}
.dv-dev iframe{display:block;border:0;background:#fff;border-radius:22px}
.dv-dev.pc iframe{border-radius:6px}
@media (max-width:600px){.dv-bar{top:72px}.dv-bar button{padding:7px 9px}.dv-bar .txt{display:none}}
</style>
<div class="dv-bar" id="dvBar"></div>
<div class="dv-ov" id="dvOv" role="dialog" aria-label="表示確認"><div class="dv-label" id="dvLabel"></div><div class="dv-wrap" id="dvWrap"><div class="dv-dev" id="dvDev"><iframe id="dvFrame" title="preview"></iframe></div></div></div>
<script>
(() => {
  const ICON = {
    sp:'<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>',
    tab:'<svg viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M11 18.5h2"/></svg>',
    pc:'<svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>',
    rot:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></svg>',
    x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };
  const DEV = { sp:{ w:390, h:844, ja:'スマホ' }, tab:{ w:820, h:1180, ja:'iPad' }, pc:{ w:1440, h:900, ja:'PC' } };
  const bar = document.getElementById('dvBar'), ov = document.getElementById('dvOv');
  const dev = document.getElementById('dvDev'), frame = document.getElementById('dvFrame'), label = document.getElementById('dvLabel');
  let cur = null, land = false;
  const btn = (k, html, title) => `<button data-dv="${k}" title="${title}">${html}</button>`;
  const barHTML = () =>
    btn('sp', ICON.sp + '<span class="txt">スマホ</span>', 'スマホ') +
    btn('tab', ICON.tab + '<span class="txt">iPad</span>', 'iPad') +
    btn('pc', ICON.pc + '<span class="txt">PC</span>', 'PC') +
    (cur ? '<span class="sep"></span>' + btn('rot', ICON.rot + '<span class="txt">縦/横</span>', '縦/横') + btn('close', ICON.x + '<span class="txt">閉じる</span>', '閉じる') : '');
  const fit = () => {
    if(!cur) return;
    const d = DEV[cur], w = land && cur !== 'pc' ? d.h : d.w, h = land && cur !== 'pc' ? d.w : d.h;
    frame.style.width = w + 'px'; frame.style.height = h + 'px';
    const pad = cur === 'pc' ? 20 : 28;
    const sc = Math.min(1, (innerWidth - 32) / (w + pad), (innerHeight - 120) / (h + pad));
    dev.style.transform = `scale(${sc})`;
    dev.parentElement.style.width = (w + pad) * sc + 'px'; dev.parentElement.style.height = (h + pad) * sc + 'px';
    label.textContent = `${d.ja}${cur !== 'pc' ? (land ? '（横）' : '（縦）') : ''}  ${w} × ${h}px${sc < 1 ? `  ・  ${Math.round(sc * 100)}%で表示` : ''}`;
  };
  const render = () => {
    const html = barHTML();
    bar.innerHTML = cur ? '' : html;
    let inner = ov.querySelector('.dv-bar');
    if(!inner){ inner = document.createElement('div'); inner.className = 'dv-bar'; ov.prepend(inner); }
    inner.innerHTML = html;
    document.querySelectorAll('[data-dv]').forEach(b => b.classList.toggle('on', b.dataset.dv === cur));
    bar.style.display = cur ? 'none' : '';
    ov.classList.toggle('on', !!cur);
    document.documentElement.style.overflow = cur ? 'hidden' : '';
    dev.classList.toggle('pc', cur === 'pc');
    fit();
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-dv]'); if(!b) return;
    const k = b.dataset.dv;
    if(k === 'close') cur = null;
    else if(k === 'rot') land = !land;
    else { if(!cur) frame.src = location.pathname + '?frame=1' + location.hash; cur = k; if(k === 'pc') land = false; }
    render();
  });
  addEventListener('keydown', e => { if(e.key === 'Escape' && cur){ cur = null; render(); } });
  addEventListener('resize', fit);
  render();
})();
</script>
<div class="proto" id="proto"><b>帯の案</b><div data-k="div"></div><b>背景の案</b><div data-k="sec"></div></div>
<script>
(() => {
  const root = document.documentElement, KEY = 'pk_proto';
  let st = {}; try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){}
  st = { div: st.div || 'a', sec: st.sec || 'a' };
  const apply = () => { root.dataset.div = st.div; root.dataset.sec = st.sec;
    document.querySelectorAll('#proto [data-k]').forEach(w => w.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.textContent === st[w.dataset.k].toUpperCase())));
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} };
  document.querySelectorAll('#proto [data-k]').forEach(w => { 'abcde'.split('').forEach(c => { const b = document.createElement('button'); b.textContent = c.toUpperCase(); b.onclick = () => { st[w.dataset.k] = c; apply(); }; w.append(b); }); });
  apply();
})();
</script>
